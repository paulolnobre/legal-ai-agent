name: Test Feature Branch

on:
  # Feature branches only. A pull request to main is already gated by "CI/CD",
  # which runs the same tests plus ruff, the image build and the architecture
  # check — repeating the weaker half here would only spend Actions minutes.
  push:
    branches-ignore:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run local tests
        run: |
          if [ -d "tests" ] || ls test_*.py *.test.py 1>/dev/null 2>&1; then
            pytest
          else
            echo "Nenhum arquivo de teste automatizado (pytest) encontrado ainda. Pronto para receber os primeiros testes da branch."
          fi
